# Runs on the Oracle VM. No database container here — Postgres is Supabase
# (managed, external). The frontend is static and deployed separately to
# Cloudflare Pages, not part of this compose file at all.
#
# No local reverse proxy/TLS either (no Caddy) — on the 1GB-RAM Always
# Free AMD shape, Cloudflare terminates HTTPS at its edge and talks plain
# HTTP to this VM instead (Cloudflare SSL/TLS mode: "Flexible"), which
# saves running a second process on a memory-constrained instance. The API
# listens on port 80 directly. If you later move to a bigger instance and
# want the VM to terminate its own TLS instead, reintroduce a Caddy (or
# nginx) service in front of `api` and switch Cloudflare to "Full".
#
# Usage (from the repo root on the VM, after `git pull`):
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# First run only, to create the schema:
#   docker compose -f deploy/docker-compose.prod.yml exec api npx prisma migrate deploy

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:4000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
