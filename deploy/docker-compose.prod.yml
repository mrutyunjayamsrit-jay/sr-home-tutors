# Runs on the Oracle VM. No database container here — Postgres is Supabase
# (managed, external); this only runs the API + a reverse proxy in front of
# it. The frontend is static and deployed separately to Cloudflare Pages,
# not part of this compose file at all.
#
# Usage (from the repo root on the VM, after `git pull`):
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# First run only, to create the schema:
#   docker compose -f deploy/docker-compose.prod.yml exec api npx prisma migrate deploy

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
